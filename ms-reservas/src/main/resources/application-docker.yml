spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}?currentSchema=reservas
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_schema: reservas
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

reserva:
  ttl-segundos: ${RESERVA_TTL_SEGUNDOS}
