spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}?currentSchema=usuarios
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_schema: usuarios
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

jwt:
  secret: ${JWT_SECRET}
  expiracion-ms: ${JWT_EXPIRACION_MS}
