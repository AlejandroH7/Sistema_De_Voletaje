networks:
  red-sold-out:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:

services:

  postgres:
    image: postgres:15-alpine
    container_name: soldout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       soldout_db
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - red-sold-out
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d soldout_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: soldout-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - red-sold-out
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: soldout-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    ports:
      - "2181:2181"
    networks:
      - red-sold-out
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep Mode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: soldout-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:   INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS:             INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENERS:                        INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME:       INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
    networks:
      - red-sold-out
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:latest
    container_name: soldout-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - red-sold-out

  grafana:
    image: grafana/grafana:latest
    container_name: soldout-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - red-sold-out

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: soldout-api-gateway
    restart: on-failure
    ports:
      - "${PORT_GATEWAY}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET:             ${JWT_SECRET}
    depends_on:
      - ms-usuarios
      - ms-eventos
      - ms-inventario
      - ms-reservas
      - ms-pagos
      - ms-notificaciones
    networks:
      - red-sold-out

  ms-usuarios:
    build:
      context: ./ms-usuarios
      dockerfile: Dockerfile
    container_name: soldout-ms-usuarios
    restart: on-failure
    ports:
      - "${PORT_USUARIOS}:8081"
    environment:
      SPRING_PROFILES_ACTIVE:     docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/soldout_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET:                 ${JWT_SECRET}
      JWT_EXPIRACION_MS:          ${JWT_EXPIRACION_MS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red-sold-out

  ms-eventos:
    build:
      context: ./ms-eventos
      dockerfile: Dockerfile
    container_name: soldout-ms-eventos
    restart: on-failure
    ports:
      - "${PORT_EVENTOS}:8082"
    environment:
      SPRING_PROFILES_ACTIVE:     docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/soldout_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS:    ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - red-sold-out

  ms-inventario:
    build:
      context: ./ms-inventario
      dockerfile: Dockerfile
    container_name: soldout-ms-inventario
    restart: on-failure
    ports:
      - "${PORT_INVENTARIO}:8083"
    environment:
      SPRING_PROFILES_ACTIVE:     docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/soldout_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS:    ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST:                 ${REDIS_HOST}
      REDIS_PORT:                 ${REDIS_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - red-sold-out

  ms-reservas:
    build:
      context: ./ms-reservas
      dockerfile: Dockerfile
    container_name: soldout-ms-reservas
    restart: on-failure
    ports:
      - "${PORT_RESERVAS}:8084"
    environment:
      SPRING_PROFILES_ACTIVE:     docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/soldout_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS:    ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_HOST:                 ${REDIS_HOST}
      REDIS_PORT:                 ${REDIS_PORT}
      RESERVA_TTL_SEGUNDOS:       ${RESERVA_TTL_SEGUNDOS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - red-sold-out

  ms-pagos:
    build:
      context: ./ms-pagos
      dockerfile: Dockerfile
    container_name: soldout-ms-pagos
    restart: on-failure
    ports:
      - "${PORT_PAGOS}:8085"
    environment:
      SPRING_PROFILES_ACTIVE:     docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/soldout_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS:    ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - red-sold-out

  ms-notificaciones:
    build:
      context: ./ms-notificaciones
      dockerfile: Dockerfile
    container_name: soldout-ms-notificaciones
    restart: on-failure
    ports:
      - "${PORT_NOTIFICACIONES}:8086"
    environment:
      SPRING_PROFILES_ACTIVE:     docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/soldout_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS:    ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - red-sold-out
